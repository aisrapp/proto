syntax = "proto3";

package aisr.v1;

option go_package = "github.com/aisrapp/aisr/gen/aisr/v1;aisrv1";

service DiarizeService {
  rpc Diarize(DiarizeRequest) returns (DiarizeResponse);
}

message DiarizeRequest {
  string audio_path = 1;
  string result_path = 2;
  map<string, string> params = 3;
}

message DiarizeResponse {
  optional string error = 1;
}
